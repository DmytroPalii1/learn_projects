version: '3.8'

services:
  db:
    image: postgres:15
    container_name: saas-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: saas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: saas-app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:secretpassword@db:5432/saas_db
      - SECRET_KEY=super-secret-jwt-key-change-me-later-12345
    depends_on:
      - db

volumes:
  postgres_data: